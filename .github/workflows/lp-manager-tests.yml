name: LP Manager tests

on:
  push:
    branches:
      - main
      - "v0.*-development"
      - "v0.8.7"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q lp_manager
      - name: Test
        run: pytest -q
      - name: Check browser JavaScript
        run: node --check lp_manager/static/app.js

  package:
    needs: test
    if: github.ref == 'refs/heads/v0.8.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release ZIP
        run: |
          mkdir -p release/lp_manager_v0_8_7
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.pytest_cache' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='data' \
            ./ release/lp_manager_v0_8_7/
          cd release
          zip -qr ../LP_Manager_V0.8.7.zip lp_manager_v0_8_7
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LP_Manager_V0.8.7
          path: LP_Manager_V0.8.7.zip
          if-no-files-found: error

# v0.8.7 validation pass 3
