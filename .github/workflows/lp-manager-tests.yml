name: LP Manager tests

on:
  push:
    branches:
      - main
      - "v0.*-development"
      - "v0.8.7"
      - "v0.8.8"
      - "v0.8.9"
      - "v0.8.10"
      - "v0.8.11"
      - "v0.9"
      - "v0.9.1"
      - "v0.9.2"
      - "v0.9.3"
      - "v0.9.4"
      - "v0.9.5"
      - "v0.9.6.1"
      - "v0.9.6.2"\n      - "v0.9.6.3"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q lp_manager
      - name: Test
        run: pytest -q
      - name: Check browser JavaScript
        run: node --check lp_manager/static/app.js

  package:
    needs: test
    if: github.ref == 'refs/heads/v0.9.5' || github.ref == 'refs/heads/v0.9.6.1' || github.ref == 'refs/heads/v0.9.6.2' || github.ref == 'refs/heads/v0.9.6.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean release ZIP
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          zip -r "dist/LP_Manager_${VERSION}.zip" . \
            -x '.git/*' 'dist/*' '__pycache__/*' '*.pyc' '.venv/*' 'data/*' '.env'
      - name: Upload branch release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LP_Manager_${{ github.ref_name }}
          path: dist/LP_Manager_${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30
