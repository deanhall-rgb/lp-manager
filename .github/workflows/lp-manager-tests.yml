name: LP Manager tests

on:
  push:
    branches:
      - "main"
      - "v0.*-development"
      - "v0.8.7"
      - "v0.8.8"
      - "v0.8.9"
      - "v0.8.10"
      - "v0.8.11"
      - "v0.9"
      - "v0.9.1"
      - "v0.9.2"
      - "v0.9.3"
      - "v0.9.4"
      - "v0.9.5"
      - "v0.9.6.1"
      - "v0.9.6.2"
      - "v0.9.6.3"
      - "v0.9.6.4"
      - "v0.9.6.4.1"
      - "v0.9.6.4.2"
      - "v0.9.7.1"
      - "v0.9.7.2"
      - "v0.9.7.2.1"
      - "v0.9.7.3"
      - "v0.9.7.3.1"
      - "v0.9.7.4"
      - "v0.9.7.4.1"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q lp_manager
      - name: Test
        run: pytest -q
      - name: Check browser JavaScript
        run: node --check lp_manager/static/app.js

  package:
    needs: test
    if: github.ref == 'refs/heads/v0.9.5' || github.ref == 'refs/heads/v0.9.6.1' || github.ref == 'refs/heads/v0.9.6.2' || github.ref == 'refs/heads/v0.9.6.3' || github.ref == 'refs/heads/v0.9.6.4' || github.ref == 'refs/heads/v0.9.6.4.1' || github.ref == 'refs/heads/v0.9.6.4.2' || github.ref == 'refs/heads/v0.9.7.1' || github.ref == 'refs/heads/v0.9.7.2' || github.ref == 'refs/heads/v0.9.7.2.1' || github.ref == 'refs/heads/v0.9.7.3' || github.ref == 'refs/heads/v0.9.7.3.1' || github.ref == 'refs/heads/v0.9.7.4' || github.ref == 'refs/heads/v0.9.7.4.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage clean release contents
        run: |
          mkdir -p dist/release
          rsync -a ./ dist/release/ \
            --exclude '.git/' \
            --exclude 'dist/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.venv/' \
            --exclude 'data/' \
            --exclude '.env'
      - name: Upload branch release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LP_Manager_${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
