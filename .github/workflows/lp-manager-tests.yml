name: LP Manager tests

on:
  push:
    branches:
      - main
      - "v0.*-development"
      - "v0.8.7"
      - "v0.8.8"
      - "v0.8.9"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q lp_manager
      - name: Test
        run: pytest -q
      - name: Check browser JavaScript
        run: node --check lp_manager/static/app.js

  package:
    needs: test
    if: github.ref == 'refs/heads/v0.8.9' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean V0.8.9 release ZIP
        run: |
          mkdir -p dist
          zip -r dist/LP_Manager_v0.8.9.zip . \
            -x '.git/*' 'dist/*' '__pycache__/*' '*.pyc' '.venv/*' 'data/*' '.env'
      - name: Upload V0.8.9 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LP_Manager_v0.8.9
          path: dist/LP_Manager_v0.8.9.zip
          if-no-files-found: error
          retention-days: 30
